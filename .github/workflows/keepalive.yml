# M1 milestone 4 (D-165): the weekly ping.
#
# A free Supabase project pauses after 7 days with no database activity, and a
# paused project means nobody can log in or open a saved case. Once a week this
# runs the smallest real query (public.keepalive(), returns 1).
#
# Tuesday 09:00 UTC: mid-week, far from Shabbos and from her Sunday routines.
# The two values are repository secrets (Settings → Secrets → Actions); the
# publishable key is public anyway, it is kept there so it is not in a file.
#
# ⚠️ GitHub switches off a scheduled job after 60 days with no commits to the
# repo. If the project goes quiet for two months, re-enable it in the Actions tab.
name: keepalive

on:
  schedule:
    - cron: '0 9 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          out=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "keepalive answered: $out"
          test "$out" = "1"

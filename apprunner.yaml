# =============================================================================
# How AWS App Runner builds and runs Before You Go.
# =============================================================================
#
# App Runner reads this file from the repository root every time you push. There
# is no server to configure, no machine to log into: this file IS the
# deployment. Change it, push, and the next deploy uses the new instructions.
#
# ⭐ One service serves everything. The website is built into static files and
# handed to the same Fastify process that answers /api/v1/*, so there is exactly
# one URL, and therefore no CORS and no API address to keep in sync.

version: 1.0
runtime: nodejs22

build:
  commands:
    build:
      # `npm ci` — "clean install". Unlike `npm install` it installs EXACTLY the
      # versions in package-lock.json and never quietly upgrades anything. That
      # is what makes a deploy reproducible: the server runs the same versions
      # your tests passed on.
      #
      # ⚠️ Do NOT set NODE_ENV=production anywhere in this file. npm treats that
      # as "skip devDependencies", and vite (which builds the website) and tsx
      # (which runs the API) both live there. The build would fail with a
      # confusing "command not found".
      - npm ci
      # Turns apps/web/src into plain HTML, CSS and JS in apps/web/dist.
      - npm run build --workspace @byg/web

run:
  command: npm run start --workspace @byg/api
  network:
    # Must match the port the server actually listens on. App Runner sends its
    # health check here; if this is wrong the deploy fails with no useful error.
    port: 3001
  env:
    # See the comment in apps/api/src/server.ts. Inside a container, 127.0.0.1
    # refuses the health check and the deploy fails.
    - name: HOST
      value: "0.0.0.0"
